name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 北京时间 8:00
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest data
        timeout-minutes: 20
        run: bash scripts/daily-update.sh
        env:
          NODE_ENV: production

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "AceTrip Bot"
          git config user.email "bot@acetrip.app"
          git add data/
          git commit -m "chore: daily data update $(date +%Y-%m-%d)"
          git push

      - name: Deploy updated data to Vercel
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 10
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
